[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygit"
version = "0.1.0"
description = "A Git clone written in Python"
readme = "README.md"
authors = [{ name = "PyGit Developers" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
pygit = "pygitbackend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
